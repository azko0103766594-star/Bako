<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flash Pro - Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>⚔️ DUEL MODE</h1>

  <input id="p1" placeholder="Joueur 1">
  <input id="p2" placeholder="Joueur 2">

  <p id="turn">Entrez les noms</p>

  <p>Niveau : <span id="level">1</span></p>
  <p>Score : <span id="score">0</span></p>

  <div class="grid">
    <div class="btn red" onclick="pick('red')"></div>
    <div class="btn green" onclick="pick('green')"></div>
    <div class="btn blue" onclick="pick('blue')"></div>
    <div class="btn yellow" onclick="pick('yellow')"></div>
  </div>

  <button onclick="startGame()">START DUEL</button>
  <button onclick="check()">VALIDER</button>
</div>

<script src="duel.js"></script>
</body>
</html>
