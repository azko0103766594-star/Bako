<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h3>Mini Bako</h3>

  <div>
    <!-- ⚠️ PAS hidden (bug mobile) -->
    <input type="file" id="upload" style="display:none;" accept="image/*">
    <button id="publishBtn">Publier</button>
  </div>
</header>

<!-- FEED VIDE (les images viennent du Worker) -->
<div class="container" id="feed"></div>

<!-- COMMENTAIRES -->
<div class="comment-overlay" id="commentOverlay" style="display:none;">
  <div class="comment-box">

    <div class="top">
      <h4>Commentaires</h4>
      <button id="closeBtn">✖</button>
    </div>

    <div id="commentList" class="comment-list"></div>

    <div class="comment-input">
      <input id="commentInput" placeholder="Commentaire...">
      <button id="sendBtn">Envoyer</button>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
