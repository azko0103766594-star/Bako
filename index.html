<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flash Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🧠 Memory Flash Pro</h1>

  <!-- MODE SELECT -->
  <div id="menu">
    <button onclick="setMode('solo')">🎮 Solo</button>
    <button onclick="setMode('duel')">⚔️ Duel 2 joueurs</button>
  </div>

  <!-- NOMS -->
  <div id="playersSetup" class="hidden">
    <input id="p1" placeholder="Nom Joueur 1">
    <input id="p2" placeholder="Nom Joueur 2">
    <button onclick="startDuel()">Démarrer Duel</button>
  </div>

  <p id="turn"></p>

  <p>Niveau : <span id="level">1</span></p>

  <p>Score P1 : <span id="score1">0</span> | Score P2 : <span id="score2">0</span></p>

  <p id="msg">Choisis un mode</p>
  <p id="timer"></p>

  <div id="flashGrid" class="grid">
    <div class="btn red" onclick="pick('red')"></div>
    <div class="btn green" onclick="pick('green')"></div>
    <div class="btn blue" onclick="pick('blue')"></div>
    <div class="btn yellow" onclick="pick('yellow')"></div>
  </div>

  <div id="answerBox" class="hidden">
    <p>Reproduis la séquence</p>
    <button onclick="check()">Valider</button>
  </div>

  <button onclick="startGame()">START SOLO</button>

</div>

<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="failSound" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
