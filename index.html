<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
  <h3>Mini Bako</h3>
  <div class="header-actions">
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<!-- FEED -->
<div class="container" id="feed"></div>

<!-- COMMENT OVERLAY -->
<div class="comment-overlay" id="commentOverlay" style="display:none;">
  <div class="comment-header">
    <h4>Commentaires</h4>
    <button onclick="closeComments()">✖</button>
  </div>

  <div class="comment-list" id="commentList"></div>

  <div class="comment-input">
    <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
    <button onclick="submitComment()">Envoyer</button>
  </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://TON_PROJECT.supabase.co";  // remplace par ton URL Supabase
  const SUPABASE_ANON_KEY = "TON_ANON_KEY";               // remplace par ta clé anonyme
  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<!-- SCRIPT -->
<script type="module" src="script.js"></script>
</body>
</html>
