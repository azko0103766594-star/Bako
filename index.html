<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🧠 Memory Flash</h1>

  <p id="msg">Appuie sur START</p>

  <div id="flashGrid" class="grid">
    <div class="btn red"></div>
    <div class="btn green"></div>
    <div class="btn blue"></div>
    <div class="btn yellow"></div>
  </div>

  <div id="answerBox" class="answers hidden">
    <p>Quelles couleurs as-tu vues ?</p>

    <button onclick="pick('red')">Rouge</button>
    <button onclick="pick('green')">Vert</button>
    <button onclick="pick('blue')">Bleu</button>
    <button onclick="pick('yellow')">Jaune</button>

    <br><br>
    <button onclick="check()">Valider</button>
  </div>

  <button onclick="startGame()">START</button>
</div>

<script src="script.js"></script>
</body>
</html>
