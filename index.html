<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Supercars Showroom</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f19;
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#0f172a;
position:sticky;
top:0;
z-index:1000;
}

.logo{
color:#38bdf8;
font-size:22px;
font-weight:bold;
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
}

/* HERO */
.hero{
height:70vh;
background:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70') center/cover;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:50px;
background:rgba(0,0,0,0.5);
padding:10px 20px;
border-radius:10px;
}

.hero p{
margin-top:10px;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#111827;
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{transform:scale(1.03)}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
color:#38bdf8;
font-weight:bold;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
}

.modal-content{
background:#0f172a;
padding:20px;
border-radius:15px;
width:90%;
max-width:600px;
}

.modal img{
width:100%;
border-radius:10px;
}

.close{
float:right;
cursor:pointer;
font-size:20px;
}

/* BUTTONS */
.btn{
display:inline-block;
margin:5px;
padding:10px;
border-radius:8px;
text-decoration:none;
color:white;
font-weight:bold;
}

.wa{background:#25D366}
.fb{background:#1877F2}
.ig{background:#E1306C}

/* MAP */
.map{
padding:30px;
}
iframe{
width:100%;
height:300px;
border:0;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<div class="logo">LUX SUPERCARS</div>
<nav>
<a href="#">Accueil</a>
<a href="#cars">Voitures</a>
<a href="#map">Localisation</a>
</nav>
</header>

<div class="hero">
<h1>Luxury Supercars Showroom</h1>
<p>Les voitures les plus chères et exclusives du monde</p>
</div>

<div class="container" id="carList"></div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<img id="img">
<h2 id="title"></h2>
<p id="desc"></p>
<h3 id="price"></h3>

<div>
<a id="wa" class="btn wa" target="_blank">WhatsApp</a>
<a id="fb" class="btn fb" target="_blank">Facebook</a>
<a id="ig" class="btn ig" target="_blank">Instagram</a>
</div>
</div>
</div>

<!-- MAP -->
<div class="map" id="map">
<h2>Notre localisation</h2>
<iframe 
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1986.0!2d-3.982!3d5.35!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1">
</iframe>
</div>

<script>

const cars = [
{ id:1, name:"Bugatti Chiron", price:"3 000 000€", img:"https://images.unsplash.com/photo-1549921296-3a6b3a9c3a60", desc:"1500 chevaux, vitesse 420km/h" },
{ id:2, name:"Rolls Royce Boat Tail", price:"28 000 000€", img:"https://images.unsplash.com/photo-1619767886558-efdc259cde1a", desc:"Voiture la plus chère du monde" },
{ id:3, name:"Lamborghini Veneno", price:"4 500 000€", img:"https://images.unsplash.com/photo-1617531653332-bd46c24f5c02", desc:"Design futuriste extrême" },
{ id:4, name:"Ferrari LaFerrari", price:"3 200 000€", img:"https://images.unsplash.com/photo-1592194996308-7b43878e84a6", desc:"Hybride ultra performance" },
{ id:5, name:"Pagani Huayra", price:"3 500 000€", img:"https://images.unsplash.com/photo-1605559424843-9e3f2b8f5a7a", desc:"Art automobile italien" },
{ id:6, name:"Koenigsegg Jesko", price:"3 000 000€", img:"https://images.unsplash.com/photo-1619767886558-efdc259cde1a", desc:"Hypercar suédoise 1600hp" },
{ id:7, name:"McLaren Speedtail", price:"2 200 000€", img:"https://images.unsplash.com/photo-1600703137323-8d5f6f7f8c8d", desc:"Vitesse + design aérodynamique" },
{ id:8, name:"Aston Martin Valkyrie", price:"3 500 000€", img:"https://images.unsplash.com/photo-1617531653332-bd46c24f5c02", desc:"F1 de route" },
{ id:9, name:"Mercedes Maybach Exelero", price:"8 000 000€", img:"https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6", desc:"Luxe extrême unique" },
{ id:10, name:"Bugatti Divo", price:"5 000 000€", img:"https://images.unsplash.com/photo-1549921296-3a6b3a9c3a60", desc:"Ultra rare Bugatti" },
{ id:11, name:"Lamborghini Sian", price:"3 600 000€", img:"https://images.unsplash.com/photo-1600703137323-8d5f6f7f8c8d", desc:"Hybrid V12" },
{ id:12, name:"Ferrari Monza SP2", price:"2 800 000€", img:"https://images.unsplash.com/photo-1592194996308-7b43878e84a6", desc:"Open cockpit racing" },
{ id:13, name:"Porsche 918 Spyder", price:"1 500 000€", img:"https://images.unsplash.com/photo-1617531653332-bd46c24f5c02", desc:"Hybrid sport legend" },
{ id:14, name:"Bentley Bacalar", price:"2 000 000€", img:"https://images.unsplash.com/photo-1619767886558-efdc259cde1a", desc:"Ultra luxury handcrafted" },
{ id:15, name:"Rolls Royce Phantom", price:"1 200 000€", img:"https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6", desc:"Confort royal ultime" }
];

const list = document.getElementById("carList");

function show(){
list.innerHTML="";
cars.forEach(c=>{
list.innerHTML+=`
<div class="card" onclick="openM(${c.id})">
<img src="${c.img}">
<div class="card-content">
<h3>${c.name}</h3>
<p class="price">${c.price}</p>
</div>
</div>
`;
});
}

function openM(id){
const c = cars.find(x=>x.id===id);

document.getElementById("img").src=c.img;
document.getElementById("title").innerText=c.name;
document.getElementById("desc").innerText=c.desc;
document.getElementById("price").innerText=c.price;

// liens réservation
document.getElementById("wa").href="https://wa.me/225000000000?text=Je%20veux%20réserver%20"+c.name;
document.getElementById("fb").href="https://facebook.com";
document.getElementById("ig").href="https://instagram.com";

document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

show();

</script>

</body>
</html>
