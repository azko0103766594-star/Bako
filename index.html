<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Life</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <div class="topbar">
        <h1>Empire Life</h1>
        <div id="money">💰 0 €</div>
    </div>

    <div class="world">

        <div class="house">
            🏚️
            <p>Petite Maison</p>
        </div>

        <div class="character" id="player">
            🧍
        </div>

    </div>

    <div class="progress-box">
        <p>Objectif : 500 € pour ouvrir une boutique</p>
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="jobs">

        <button onclick="work(5)">
            🧹 Nettoyer la rue<br>
            +5 €
        </button>

        <button onclick="work(10)">
            📦 Porter des colis<br>
            +10 €
        </button>

        <button onclick="work(20)">
            🚲 Livrer des commandes<br>
            +20 €
        </button>

    </div>

    <div id="unlockShop" class="unlock">
        🏪 Boutique débloquée !
        <br>
        Passe au niveau suivant.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
