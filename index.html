<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flash Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🧠 Memory Flash Pro</h1>

  <!-- MENU MODES -->
  <div id="menu">
    <h2>Choisis un mode 🎮</h2>

    <button onclick="setMode('easy')">🟢 Facile</button>
    <button onclick="setMode('normal')">🟡 Normal</button>
    <button onclick="setMode('hard')">🔴 Difficile</button>
    <button onclick="setMode('insane')">⚡ Impossible</button>

    <br><br>
    <button onclick="startGame()">START</button>
  </div>

  <p>Niveau : <span id="level">1</span></p>
  <p>Score : <span id="score">0</span></p>

  <p id="msg">Choisis un mode</p>
  <p id="timer"></p>

  <!-- GAME GRID -->
  <div id="flashGrid" class="grid">
    <div class="btn red" onclick="pick('red')"></div>
    <div class="btn green" onclick="pick('green')"></div>
    <div class="btn blue" onclick="pick('blue')"></div>
    <div class="btn yellow" onclick="pick('yellow')"></div>
  </div>

</div>

<!-- SONS -->
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="failSound" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
