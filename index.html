<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <h1>⏳ Future Clicker</h1>

    <div class="money">
        Argent : <span id="money">0</span> $
    </div>

    <div class="debt">
        Dette du futur : <span id="debt">0</span> $
    </div>

    <div class="timer">
        Temps restant : <span id="time">0</span>s
    </div>

    <button id="borrowBtn">
        Emprunter 1000$
    </button>

    <button id="factoryBtn">
        Acheter une usine (500$)
    </button>

    <button id="payBtn">
        Rembourser
    </button>

    <div class="factory">
        Usines : <span id="factories">0</span>
    </div>

    <div id="message"></div>

</div>

<script src="script.js"></script>
</body>
</html>
