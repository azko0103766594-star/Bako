<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Bako</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h3>Mini Bako</h3>
  <div>
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<!-- SHARE -->
<div class="share-box" id="shareBox">
  <div class="share">
    <p>Partager ce post</p>
    <button onclick="sharePost()">📤 Partager</button>
    <button onclick="closeShare()">❌ Fermer</button>
  </div>
</div>

<div class="container" id="feed"></div>

<!-- COMMENT -->
<div class="comment-overlay" id="commentOverlay">
  <button onclick="closeComments()">Fermer</button>

  <div class="comment-list" id="commentList"></div>

  <div class="comment-form">
    <input id="commentInput" placeholder="Écrire un commentaire...">
    <button onclick="submitComment()">Envoyer</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
