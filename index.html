<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<!-- Firebase JS SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "TON_API_KEY",
    authDomain: "TON_PROJECT_ID.firebaseapp.com",
    projectId: "TON_PROJECT_ID",
    storageBucket: "TON_PROJECT_ID.appspot.com",
    messagingSenderId: "TON_SENDER_ID",
    appId: "TON_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.firebaseApp = { db };
</script>

<!-- Supabase config -->
<script type="module">
  const SUPABASE_URL = "https://TON_PROJECT.supabase.co";   // Remplace par ton URL Supabase
  const SUPABASE_ANON_KEY = "TON_ANON_KEY";                // Remplace par ta clé anonyme
  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

</head>

<body>
  <!-- HEADER -->
  <header>
    <h3>Mini Bako</h3>
    <div class="header-actions">
      <input type="file" id="upload" style="display:none;" accept="image/*">
      <button id="publishBtn">Publier</button>
    </div>
  </header>

  <!-- FEED -->
  <div class="container" id="feed"></div>

  <!-- SHARE BOX -->
  <div class="share-box" id="shareBox" style="display:none;">
    <div class="share">
      <p>Partager ce post</p>
      <button onclick="sharePost()">📤 Partager</button>
      <button onclick="closeShare()">❌ Fermer</button>
    </div>
  </div>

  <!-- COMMENT OVERLAY -->
  <div class="comment-overlay" id="commentOverlay" style="display:none;">
    <div class="comment-header">
      <h4>Commentaires</h4>
      <button onclick="closeComments()">✖</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input">
      <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
      <button onclick="submitComment()">Envoyer</button>
    </div>
  </div>

  <!-- SCRIPT JS -->
  <script type="module">
    // 🔹 Récupération des éléments
    const feed = document.getElementById("feed");
    const upload = document.getElementById("upload");
    const publishBtn = document.getElementById("publishBtn");
    const commentOverlay = document.getElementById("commentOverlay");
    const commentList = document.getElementById("commentList");
    const commentInput = document.getElementById("commentInput");

    let posts = [];
    let currentCommentId = null;
    const userId = "user1"; // temporaire

    // 🔹 Bouton Publier
    publishBtn.addEventListener("click", () => upload.click());

    // 🔹 Upload image + post Firestore
    upload.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        // Supabase Storage
        const { data, error } = await supabase.storage
          .from('images') // bucket public
          .upload(`public/${Date.now()}_${file.name}`, file);

        if (error) throw error;

        const { publicUrl, error: urlError } = supabase.storage
          .from('images')
          .getPublicUrl(data.path);

        if (urlError) throw urlError;

        // Firestore
        await addDoc(collection(firebaseApp.db, "posts"), {
          url: publicUrl,
          likes: [],
          comments: []
        });

        fetchPosts();

      } catch (err) {
        console.error("Erreur upload:", err);
        alert("Erreur lors de l'upload !");
      }
    });

    // 🔹 Fetch posts
    async function fetchPosts() {
      const querySnapshot = await getDocs(collection(firebaseApp.db, "posts"));
      posts = [];
      querySnapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
      renderFeed();
    }

    // 🔹 Render feed
    function renderFeed() {
      feed.innerHTML = "";
      if (posts.length === 0) {
        feed.innerHTML = "<div class='empty'>Aucune image</div>";
        return;
      }

      posts.forEach((p, i) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${p.url}" style="width:200px; margin:10px">
          <div>
            ❤️ ${p.likes?.length || 0} | 💬 ${p.comments?.length || 0}
          </div>
          <div>
            <button onclick="toggleLike('${p.id}', ${i})">
              ${p.likes?.includes(userId) ? 'Dislike' : 'Like'}
            </button>
            <button onclick="openComments('${p.id}')">💬 Commenter</button>
          </div>
        `;

        feed.appendChild(card);
      });
    }

    // 🔹 Like / Dislike
    async function toggleLike(postId, index) {
      const postRef = doc(firebaseApp.db, "posts", postId);
      const post = posts[index];
      let likes = post.likes || [];

      if (likes.includes(userId)) likes = likes.filter(u => u !== userId);
      else likes.push(userId);

      await updateDoc(postRef, { likes });
      fetchPosts();
    }

    // 🔹 Commentaires
    function openComments(postId) {
      currentCommentId = postId;
      updateComments();
      commentOverlay.style.display = "flex";
    }

    function updateComments() {
      const post = posts.find(p => p.id === currentCommentId);
      if (!post) return;
      commentList.innerHTML = (post.comments || []).map(c => `<p>${c}</p>`).join("");
    }

    async function submitComment() {
      const v = commentInput.value.trim();
      if (!v) return;
      const postRef = doc(firebaseApp.db, "posts", currentCommentId);
      const post = posts.find(p => p.id === currentCommentId);
      const comments = post.comments || [];
      comments.push(v);

      await updateDoc(postRef, { comments });
      commentInput.value = "";
      updateComments();
      fetchPosts();
    }

    function closeComments() { commentOverlay.style.display = "none"; }

    // 🔹 Init
    fetchPosts();
  </script>
</body>
</html>
