<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#0077cc; color:white; }
  header h3 { margin:0; }
  header button { background:white; color:#0077cc; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; font-weight:bold; }
  header button:hover { background:#e6e6e6; }

  .container { display:flex; flex-wrap:wrap; padding:10px; justify-content:center; }
  .card { border:1px solid #ccc; margin:10px; padding:10px; width:220px; text-align:center; border-radius:8px; background:white; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .card img { max-width:100%; border-radius:5px; margin-bottom:5px; }
  .card button { margin:3px; padding:5px 8px; border:none; border-radius:5px; cursor:pointer; }
  .card button:hover { opacity:0.8; }

  .comment-overlay { position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000; }
  .comment-box { background:white; padding:15px; border-radius:8px; width:90%; max-width:400px; display:flex; flex-direction:column; }
  .comment-box header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .comment-box header h4 { margin:0; }
  .comment-box header button { background:#ff4d4d; color:white; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-weight:bold; }
  .comment-list { max-height:250px; overflow-y:auto; border-top:1px solid #ddd; border-bottom:1px solid #ddd; margin:5px 0; padding:5px; }
  .comment-list p { margin:5px 0; padding:5px; background:#f0f0f0; border-radius:5px; }

  .comment-input { display:flex; margin-top:10px; }
  .comment-input input { flex:1; padding:8px; border:1px solid #ccc; border-radius:5px; }
  .comment-input button { margin-left:5px; padding:8px 12px; background:#0077cc; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
  .comment-input button:hover { opacity:0.9; }

  .empty { text-align:center; color:#777; margin-top:50px; font-size:18px; }
</style>
</head>
<body>

<header>
  <h3>Mini Bako</h3>
  <div>
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<div class="container" id="feed">
  <div class="empty">Aucune image</div>
</div>

<!-- Overlay Commentaires -->
<div class="comment-overlay" id="commentOverlay">
  <div class="comment-box">
    <header>
      <h4>Commentaires</h4>
      <button onclick="closeComments()">✖</button>
    </header>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input">
      <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
      <button onclick="submitComment()">Envoyer</button>
    </div>
  </div>
</div>

<!-- SUPABASE -->

</body>
</html>
