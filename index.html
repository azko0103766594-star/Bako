<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultra Luxury Hotel - Dubai Style</title>  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
      scroll-behavior:smooth;
    }

    body{
      background:#0b0b0b;
      color:#fff;
    }

    /* ===================== */
    /* VERSION 1 - BASE LUXE */
    /* ===================== */

    nav{
      position:fixed;
      width:100%;
      top:0;
      left:0;
      background:rgba(0,0,0,0.8);
      display:flex;
      justify-content:space-between;
      padding:15px 30px;
      z-index:1000;
      backdrop-filter: blur(10px);
    }

    nav ul{
      display:flex;
      gap:20px;
      list-style:none;
    }

    nav a{
      color:#fff;
      text-decoration:none;
      font-size:14px;
    }

    .hero{
      height:100vh;
      background:url('https://images.unsplash.com/photo-1501117716987-c8e1ecb2103a') center/cover;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
    }

    .hero h1{
      font-size:60px;
      letter-spacing:2px;
    }

    .gold{
      color:#c9a24e;
    }

    .btn{
      margin-top:20px;
      padding:12px 25px;
      background:#c9a24e;
      border:none;
      color:#000;
      cursor:pointer;
      border-radius:5px;
      font-weight:bold;
    }

    section{
      padding:80px 20px;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .card{
      background:#111;
      border:1px solid #222;
      border-radius:10px;
      overflow:hidden;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
      border-color:#c9a24e;
    }

    .card img{
      width:100%;
      height:200px;
      object-fit:cover;
    }

    /* ===================== */
    /* VERSION 2 - ANIMATIONS */
    /* ===================== */

    .fade{
      opacity:0;
      transform:translateY(40px);
      transition:1s;
    }

    .fade.show{
      opacity:1;
      transform:translateY(0);
    }

    /* ===================== */
    /* VERSION 3 - ULTRA LUXE */
    /* ===================== */

    .booking{
      background:#111;
      padding:40px;
      margin-top:40px;
      border-radius:10px;
    }

    input{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:5px;
    }

    footer{
      background:#000;
      text-align:center;
      padding:20px;
      margin-top:50px;
    }

    .whatsapp{
      position:fixed;
      bottom:20px;
      right:20px;
      background:#25D366;
      padding:15px 20px;
      border-radius:50px;
      color:#fff;
      text-decoration:none;
      font-weight:bold;
    }

  </style></head>
<body><!-- NAV --><nav>
  <div><strong class="gold">DUBAI HOTEL</strong></div>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#rooms">Rooms</a></li>
    <li><a href="#gallery">Gallery</a></li>
    <li><a href="#booking">Booking</a></li>
  </ul>
</nav><!-- HERO --><div class="hero" id="home">
  <h1 class="fade">ULTRA <span class="gold">LUXURY</span> EXPERIENCE</h1>
  <button class="btn fade">Book Now</button>
</div><!-- ROOMS --><section id="rooms">
  <h2 class="fade">Our Rooms</h2>
  <div class="grid"><div class="card fade">
  <img src="https://images.unsplash.com/photo-1505691723518-36a5ac3b2e12">
  <h3>Royal Suite</h3>
</div>

<div class="card fade">
  <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
  <h3>Sea View Luxury</h3>
</div>

  </div>
</section><!-- GALLERY --><section id="gallery">
  <h2 class="fade">Gallery</h2>
  <div class="grid">
    <img class="fade" src="https://images.unsplash.com/photo-1501117716987-c8e1ecb2103a" width="100%">
    <img class="fade" src="https://images.unsplash.com/photo-1445019980597-93fa8acb246c" width="100%">
  </div>
</section><!-- BOOKING --><section id="booking">
  <h2 class="fade">Booking System</h2>  <div class="booking fade">
    <input placeholder="Full Name">
    <input placeholder="Check-in Date">
    <input placeholder="Check-out Date">
    <button class="btn">Request Booking</button>
  </div>
</section><!-- FOOTER --><footer>
  <p>© 2026 Dubai Ultra Luxury Hotel</p>
</footer><!-- WHATSAPP --><a class="whatsapp" href="https://wa.me/0000000000">WhatsApp</a>

<script>
  // Scroll animation (VERSION 2)
  const elements = document.querySelectorAll('.fade');

  window.addEventListener('scroll', () => {
    elements.forEach(el => {
      const top = el.getBoundingClientRect().top;
      if(top < window.innerHeight - 100){
        el.classList.add('show');
      }
    });
  });
</script></body>
</html>
