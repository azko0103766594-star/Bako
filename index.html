<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Factory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <h1>⏰ Time Factory</h1>

    <div class="stats">
        <h2>⏰ Temps : <span id="time">0</span>s</h2>
        <h2>💰 Argent : <span id="money">0</span></h2>
        <h2>🏭 Machines : <span id="machines">0</span></h2>
        <h2>👤 Anomalies : <span id="anomalies">0</span></h2>
        <h2>🌍 Niveau : <span id="level">Atelier</span></h2>
    </div>

    <div class="buttons">
        <button onclick="makeTime()">⚡ Fabriquer du temps</button>
        <button onclick="sellTime()">💰 Vendre le temps</button>
        <button onclick="buyMachine()">🏭 Acheter une machine (50)</button>
        <button onclick="rewindTime()">🔄 Remonter le temps</button>
    </div>

    <div id="log"></div>

</div>

<script src="script.js"></script>
</body>
</html>
