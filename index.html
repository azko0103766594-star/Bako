<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Tap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🧠 Memory Tap</h1>

    <p>Niveau : <span id="level">0</span></p>
    <p>Record : <span id="best">0</span></p>

    <div class="grid">
      <div class="btn red" onclick="tap('red')"></div>
      <div class="btn green" onclick="tap('green')"></div>
      <div class="btn blue" onclick="tap('blue')"></div>
      <div class="btn yellow" onclick="tap('yellow')"></div>
    </div>

    <button onclick="startGame()">START</button>
    <p id="msg"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
