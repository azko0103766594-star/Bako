<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>

<style>
  body { font-family: Arial; margin:0; }
  header { display:flex; justify-content:space-between; padding:10px; background:#0077cc; color:white; }
  .container { display:flex; flex-wrap:wrap; padding:10px; }
  .card { border:1px solid #ccc; margin:10px; padding:10px; width:200px; text-align:center; }
  .comment-overlay { position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
</style>

</head>
<body>

<header>
  <h3>Mini Bako</h3>
  <div>
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<div class="container" id="feed"></div>

<div class="comment-overlay" id="commentOverlay">
  <div style="background:white; padding:10px;">
    <button onclick="closeComments()">Fermer</button>
    <div id="commentList"></div>
    <input id="commentInput" placeholder="Commentaire">
    <button onclick="submitComment()">Envoyer</button>
  </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://TON_PROJET.supabase.co";
  const SUPABASE_KEY = "TA_CLE";

  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
