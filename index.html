<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0077cc; color: white; }
  .header-actions button { padding: 5px 10px; cursor: pointer; }
  .container { display: flex; flex-wrap: wrap; padding: 10px; }
  .card { border: 1px solid #ccc; margin: 10px; padding: 10px; border-radius: 8px; width: 220px; text-align: center; }
  .comment-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; }
  .comment-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .comment-list { max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; }
  .comment-input { display: flex; background: white; padding: 10px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  .comment-input input { flex:1; padding:5px; margin-right:5px; }
  .empty { padding:20px; text-align:center; color:#777; }
</style>
</head>
<body>

<header>
  <h3>Mini Bako</h3>
  <div class="header-actions">
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<div class="container" id="feed"></div>

<div class="comment-overlay" id="commentOverlay">
  <div style="background:white; border-radius:8px; width:300px;">
    <div class="comment-header">
      <h4>Commentaires</h4>
      <button onclick="closeComments()">✖</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input">
      <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
      <button onclick="submitComment()">Envoyer</button>
    </div>
  </div>
</div>

<!-- SUPABASE CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://kofqtohralddcaslhkbw.supabase.co";  // ton projet Supabase
  const SUPABASE_ANON_KEY = "sb_publishable_JsVXeIztUDAFQNOqOivbwA_5rXMjEQi"; // ta clé publique
  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<script>
// 🔹 JS complet pour Mini-Bako (images seulement)

// Éléments
const feed = document.getElementById("feed");
const upload = document.getElementById("upload");
const commentOverlay = document.getElementById("commentOverlay");
const commentList = document.getElementById("commentList");
const commentInput = document.getElementById("commentInput");

// Variables
let posts = [];
let currentCommentId = null;
const userId = "user1"; // temporaire

// Bouton Publier
window.handlePublish = () => upload.click();

// Upload image
upload.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Seules les images sont autorisées !");
    return;
  }

  try {
    const name = `${Date.now()}_${file.name}`;

    // Upload dans bucket public "Bako"
    const { error: uploadError } = await supabase
      .storage
      .from("Bako")
      .upload(name, file, { upsert: true });

    if (uploadError) throw uploadError;

    // Récupérer URL publique
    const { data } = supabase.storage.from("Bako").getPublicUrl(name);
    const url = data.publicUrl;

    // Créer post
    const { data: newPost, error: insertError } = await supabase
      .from("posts")
      .insert([{ url, likes: [], comments: [] }])
      .select();

    if (insertError) throw insertError;

    posts.unshift(newPost[0]);
    renderFeed();

  } catch (err) {
    console.error("Erreur upload ou policy :", err);
    alert("Erreur lors de la publication. Vérifie les policies RLS et le bucket.\n" + (err.message || JSON.stringify(err)));
  }
});

// Récupérer posts
async function fetchPosts() {
  try {
    const { data, error } = await supabase
      .from("posts")
      .select("*")
      .order("id", { ascending: false });

    if (error) throw error;

    posts = data;
    renderFeed();

  } catch (err) {
    console.error("Erreur fetch posts :", err);
    alert("Impossible de récupérer les posts. Vérifie les policies RLS.\n" + (err.message || JSON.stringify(err)));
  }
}

// Affichage feed
function renderFeed() {
  feed.innerHTML = "";

  if (!posts.length) {
    feed.innerHTML = "<div class='empty'>Aucune image</div>";
    return;
  }

  posts.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${p.url}" width="150"><br>
      ❤️ ${p.likes?.length || 0} | 💬 ${p.comments?.length || 0}<br>
      <button onclick="toggleLike('${p.id}')">
        ${p.likes?.includes(userId) ? "Dislike" : "Like"}
      </button>
      <button onclick="openComments('${p.id}')">Commenter</button>
    `;

    feed.appendChild(div);
  });
}

// Like / Dislike
window.toggleLike = async (id) => {
  const p = posts.find(x => x.id == id);
  if (!p) return;

  if (p.likes.includes(userId)) p.likes = p.likes.filter(x => x !== userId);
  else p.likes.push(userId);

  try {
    const { error } = await supabase
      .from("posts")
      .update({ likes: p.likes })
      .eq("id", id);

    if (error) throw error;
    renderFeed();
  } catch (err) {
    console.error("Erreur like :", err);
    alert("Impossible de liker ce post.\n" + (err.message || JSON.stringify(err)));
  }
};

// Commentaires
window.openComments = (id) => {
  currentCommentId = id;
  updateComments();
  commentOverlay.style.display = "flex";
};

function updateComments() {
  const p = posts.find(x => x.id == currentCommentId);
  commentList.innerHTML = (p.comments || []).map(c => `<p>${c}</p>`).join("");
  commentList.scrollTop = commentList.scrollHeight;
}

window.submitComment = async () => {
  const txt = commentInput.value.trim();
  if (!txt) return;

  const p = posts.find(x => x.id == currentCommentId);
  p.comments.push(txt);

  try {
    const { error } = await supabase
      .from("posts")
      .update({ comments: p.comments })
      .eq("id", currentCommentId);

    if (error) throw error;

    commentInput.value = "";
    updateComments();
    renderFeed();
  } catch (err) {
    console.error("Erreur commentaire :", err);
    alert("Impossible d'ajouter ce commentaire.\n" + (err.message || JSON.stringify(err)));
  }
};

window.closeComments = () => commentOverlay.style.display = "none";

// Initialisation
fetchPosts();
</script>

</body>
</html>
