<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #4a6cb3;
  color: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 1000;
}

button {
  border: none;
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

/* FEED */
.container {
  margin-top: 60px;
}

.card {
  width: 100%;
  height: 100vh;
  position: relative;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* OVERLAY */
.overlay {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 15px;
  color: white;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.like-btn {
  background: #ff4757;
  color: white;
}
</style>

</head>
<body>

<header>
  <h3>Mini Bako</h3>
  <input type="file" id="upload" hidden>
  <button onclick="document.getElementById('upload').click()">Publier</button>
</header>

<div class="container" id="feed"></div>

<script>
let photos = JSON.parse(localStorage.getItem("photos")) || [];

const feed = document.getElementById("feed");

function save() {
  localStorage.setItem("photos", JSON.stringify(photos));
}

function render() {
  feed.innerHTML = "";

  photos.forEach((p, i) => {
    p.views++;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.url}">

      <div class="overlay">
        <div class="actions">
          <span>❤️ ${p.likes} | 👁️ ${p.views}</span>
          <button class="like-btn" onclick="like(${i})">Like</button>
        </div>
      </div>
    `;

    feed.appendChild(card);
  });

  save();
}

function like(i) {
  photos[i].likes++;
  render();
}

document.getElementById("upload").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function() {
    photos.unshift({
      url: reader.result,
      likes: 0,
      views: 0
    });

    render();
  };

  reader.readAsDataURL(file);
});

render();
</script>

</body>
</html>
