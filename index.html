<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Pro</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

#board {
  width: 420px;
  height: 420px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(7, 1fr);
  border: 3px solid #000;
}

.cell {
  border: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
}

.track {
  background: #fafafa;
}

.pawn {
  width: 18px;
  height: 18px;
  border-radius: 50%;
}

.red { background: red; }
.blue { background: blue; }
.green { background: green; }
.yellow { background: gold; }

button {
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>🎲 Ludo PRO v1</h2>

<div id="board"></div>

<button onclick="rollDice()">🎲 Lancer dé</button>
<p id="dice">Dé: -</p>
<p id="turn">Tour: Rouge</p>

<script>
const board = document.getElementById("board");

/* 🎯 CHEMIN LUDO (boucle 52 cases simplifiée) */
let path = [];

// créer un chemin carré simple
for (let i = 0; i < 52; i++) {
  let cell = document.createElement("div");
  cell.classList.add("cell", "track");
  cell.id = "cell-" + i;
  board.appendChild(cell);
  path.push(i);
}

/* 🧠 POSITIONS */
let players = {
  red: 0,
  blue: 0,
  green: 0,
  yellow: 0
};

let order = ["red", "blue", "green", "yellow"];
let turnIndex = 0;

/* 🎮 PIONS */
let pawns = {
  red: createPawn("red"),
  blue: createPawn("blue"),
  green: createPawn("green"),
  yellow: createPawn("yellow")
};

function createPawn(color) {
  let p = document.createElement("div");
  p.className = "pawn " + color;
  document.getElementById("cell-0").appendChild(p);
  return p;
}

/* 🎲 DÉ */
function rollDice() {
  let dice = Math.floor(Math.random() * 6) + 1;
  document.getElementById("dice").innerText = "Dé: " + dice;

  movePlayer(dice);
}

/* 🚶 MOUVEMENT */
function movePlayer(step) {
  let player = order[turnIndex];

  let newPos = players[player] + step;

  if (newPos >= 51) newPos = 51; // fin du parcours

  players[player] = newPos;

  let cell = document.getElementById("cell-" + newPos);
  cell.appendChild(pawns[player]);

  checkWin(player);

  turnIndex = (turnIndex + 1) % 4;

  document.getElementById("turn").innerText =
    "Tour: " + order[turnIndex].toUpperCase();
}

/* 🏆 WIN */
function checkWin(player) {
  if (players[player] === 51) {
    setTimeout(() => {
      alert(player.toUpperCase() + " a gagné 🎉");
      resetGame();
    }, 100);
  }
}

/* 🔄 RESET */
function resetGame() {
  for (let p in players) {
    players[p] = 0;
    document.getElementById("cell-0").appendChild(pawns[p]);
  }
  turnIndex = 0;
}
</script>

</body>
</html>
