<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flash Duel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>🧠 Memory Flash Duel</h1>

  <!-- SETUP NOMS -->
  <div id="setup">
    <input id="p1" placeholder="Nom Joueur 1">
    <input id="p2" placeholder="Nom Joueur 2">
    <button onclick="startDuel()">🎮 Start Duel</button>
  </div>

  <!-- INFOS -->
  <h2 id="turnText"></h2>

  <p>Niveau : <span id="level">1</span></p>
  <p id="msg">Entre les noms puis START</p>
  <p id="timer"></p>

  <p>Score - <span id="s1">0</span> | <span id="s2">0</span></p>

  <!-- GRILLE -->
  <div id="flashGrid" class="grid">
    <div class="btn red" onclick="pick('red')"></div>
    <div class="btn green" onclick="pick('green')"></div>
    <div class="btn blue" onclick="pick('blue')"></div>
    <div class="btn yellow" onclick="pick('yellow')"></div>
  </div>

  <button onclick="check()">Valider</button>

</div>

<!-- SONS -->
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="failSound" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
