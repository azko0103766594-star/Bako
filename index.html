<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Mini</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f2f2f2;
}

#board {
  width: 320px;
  height: 320px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border: 3px solid black;
}

.cell {
  border: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
}

.path {
  background: #fff;
}

.home {
  background: #e0e0e0;
}

.pawn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
}

.red { background: red; }
.blue { background: blue; }

button {
  padding: 10px 20px;
  margin: 10px;
}
</style>
</head>

<body>

<h2>🎲 Mini Ludo</h2>

<div id="board"></div>

<button onclick="rollDice()">🎲 Lancer dé</button>
<p id="dice">Dé: -</p>
<p id="turn">Tour: Rouge</p>

<script>
const board = document.getElementById("board");

let positions = {
  red: 0,
  blue: 0
};

let turn = "red";
let size = 64; // cases totales

// créer plateau simple
for (let i = 0; i < size; i++) {
  let cell = document.createElement("div");
  cell.classList.add("cell", "path");
  cell.id = "cell-" + i;
  board.appendChild(cell);
}

// pions
let redPawn = document.createElement("div");
redPawn.className = "pawn red";

let bluePawn = document.createElement("div");
bluePawn.className = "pawn blue";

document.getElementById("cell-0").appendChild(redPawn);
document.getElementById("cell-0").appendChild(bluePawn);

function rollDice() {
  let dice = Math.floor(Math.random() * 6) + 1;
  document.getElementById("dice").innerText = "Dé: " + dice;

  movePawn(dice);
}

function movePawn(step) {
  let current = positions[turn];
  let next = current + step;

  if (next >= size) next = size - 1;

  positions[turn] = next;

  let cell = document.getElementById("cell-" + next);

  let pawn = turn === "red" ? redPawn : bluePawn;

  cell.appendChild(pawn);

  checkWin(next);

  turn = turn === "red" ? "blue" : "red";
  document.getElementById("turn").innerText =
    "Tour: " + (turn === "red" ? "Rouge" : "Bleu");
}

function checkWin(pos) {
  if (pos === size - 1) {
    alert(turn.toUpperCase() + " a gagné !");
    positions.red = 0;
    positions.blue = 0;

    document.getElementById("cell-0").appendChild(redPawn);
    document.getElementById("cell-0").appendChild(bluePawn);
  }
}
</script>

</body>
</html>
