<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h3>Mini Bako</h3>
  <div>
    <!-- ⚠️ PAS hidden -->
    <input type="file" id="upload" style="display:none;" accept="image/*">
    <button id="publishBtn">Publier</button>
  </div>
</header>

<div class="container" id="feed"></div>

<div class="comment-overlay" id="commentOverlay">
  <div class="comment-header">
    <span>Commentaires</span>
    <button id="closeComment">✖</button>
  </div>

  <div id="commentList" class="comment-list"></div>

  <div class="comment-input">
    <input id="commentInput" placeholder="Commentaire...">
    <button id="sendComment">Envoyer</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
