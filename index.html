<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<style>
  body { font-family: Arial; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#0077cc; color:white; }
  .container { display:flex; flex-wrap:wrap; padding:10px; }
  .card { border:1px solid #ccc; margin:10px; padding:10px; width:200px; text-align:center; border-radius:8px; }
  .comment-overlay { position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
  .comment-box { background:white; padding:10px; border-radius:8px; width:300px; }
  .comment-list { max-height:200px; overflow-y:auto; margin-bottom:10px; }
  .comment-input { display:flex; }
  .comment-input input { flex:1; padding:5px; margin-right:5px; }
</style>
</head>
<body>

<header>
  <h3>Mini Bako</h3>
  <div>
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<div class="container" id="feed"></div>

<div class="comment-overlay" id="commentOverlay">
  <div class="comment-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4>Commentaires</h4>
      <button onclick="closeComments()">✖</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input">
      <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
      <button onclick="submitComment()">Envoyer</button>
    </div>
  </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://kofqtohralddcaslhkbw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JsVXeIztUDAFQNOqOivbwA_5rXMjEQi"; // ta clé publique
  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

<script>
// 🔹 Éléments
const feed = document.getElementById("feed");
const upload = document.getElementById("upload");
const commentOverlay = document.getElementById("commentOverlay");
const commentList = document.getElementById("commentList");
const commentInput = document.getElementById("commentInput");

let posts = [];
let currentCommentId = null;
const userId = "user1"; // temporaire

// 🔹 Bouton Publier
window.handlePublish = () => upload.click();

// 🔹 Upload image + créer post
upload.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const name = Date.now() + "_" + file.name;

    // 1️⃣ Upload dans bucket "Bako"
    const { error: uploadError } = await supabase
      .storage
      .from("Bako")
      .upload(name, file, { upsert: true });

    if (uploadError) throw uploadError;

    // 2️⃣ Récup URL publique
    const { data } = supabase.storage.from("Bako").getPublicUrl(name);
    const url = data.publicUrl;

    // 3️⃣ Ajouter post (tout public, RLS désactivé ou policy using true)
    const { data: newPost, error: insertError } = await supabase
      .from("posts")
      .insert([{ url, likes: [], comments: [] }])
      .select();

    if (insertError) throw insertError;

    posts.unshift(newPost[0]);
    renderFeed();

  } catch (err) {
    console.error(err);
    alert("Erreur : " + (err.message || JSON.stringify(err)));
  }
});

// 🔹 Récupérer tous les posts
async function fetchPosts() {
  const { data, error } = await supabase
    .from("posts")
    .select("*")
    .order("id", { ascending: false });
  if (error) return console.error(error);

  posts = data;
  renderFeed();
}

// 🔹 Affichage feed
function renderFeed() {
  feed.innerHTML = "";
  if (posts.length === 0) {
    feed.innerHTML = "<div style='padding:20px; color:#777'>Aucune image</div>";
    return;
  }

  posts.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${p.url}" width="150"><br>
      ❤️ ${p.likes?.length || 0} | 💬 ${p.comments?.length || 0}<br>
      <button onclick="toggleLike('${p.id}')">
        ${p.likes?.includes(userId) ? "Dislike" : "Like"}
      </button>
      <button onclick="openComments('${p.id}')">Commenter</button>
    `;

    feed.appendChild(div);
  });
}

// 🔹 Like / Dislike
window.toggleLike = async (id) => {
  const p = posts.find(x => x.id == id);
  if (!p) return;

  if (p.likes.includes(userId)) p.likes = p.likes.filter(x => x !== userId);
  else p.likes.push(userId);

  await supabase
    .from("posts")
    .update({ likes: p.likes })
    .eq("id", id);

  renderFeed();
};

// 🔹 Commentaires
window.openComments = (id) => {
  currentCommentId = id;
  updateComments();
  commentOverlay.style.display = "flex";
};

function updateComments() {
  const p = posts.find(x => x.id == currentCommentId);
  commentList.innerHTML = (p.comments || []).map(c => `<p>${c}</p>`).join("");
  commentList.scrollTop = commentList.scrollHeight;
}

window.submitComment = async () => {
  const txt = commentInput.value.trim();
  if (!txt) return;

  const p = posts.find(x => x.id == currentCommentId);
  p.comments.push(txt);

  await supabase
    .from("posts")
    .update({ comments: p.comments })
    .eq("id", currentCommentId);

  commentInput.value = "";
  updateComments();
  renderFeed();
};

window.closeComments = () => commentOverlay.style.display = "none";

// 🔹 Init
fetchPosts();
</script>
</body>
</html>
