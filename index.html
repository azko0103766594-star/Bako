<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mini Instagram</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>📸 Mini Instagram</h2>

  <input type="file" id="file" hidden>
  <button onclick="document.getElementById('file').click()">➕ Upload</button>
</header>

<main id="feed"></main>

<!-- COMMENT MODAL -->
<div id="commentBox" class="hidden">
  <div class="box">
    <h3>Commentaires</h3>

    <div id="comments"></div>

    <input type="text" id="commentInput" placeholder="Écrire...">
    <button onclick="sendComment()">Envoyer</button>
    <button onclick="closeComments()">Fermer</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
