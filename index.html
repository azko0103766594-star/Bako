<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">
<style>
/* Petit style pour s'assurer que le bouton est visible */
button { cursor: pointer; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.comment-overlay, .share-box { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
.comment-list { max-height: 300px; overflow-y:auto; }
.card img { width: 100%; max-width: 400px; display: block; margin-bottom: 5px; }
</style>
</head>

<body>

<header>
  <h3>Mini Bako</h3>
  <div class="header-actions">
    <!-- input file caché -->
    <input type="file" id="upload" accept="image/*" style="display:none">
    <!-- bouton Publier visible -->
    <button id="btnPublish">Publier</button>
  </div>
</header>

<!-- SHARE -->
<div class="share-box" id="shareBox">
  <div class="share">
    <p>Partager ce post</p>
    <button id="btnShare">📤 Partager</button>
    <button id="btnCloseShare">❌ Fermer</button>
  </div>
</div>

<!-- FEED -->
<div class="container" id="feed"></div>

<!-- COMMENT -->
<div class="comment-overlay" id="commentOverlay">
  <div class="comment-header">
    <h4>Commentaires</h4>
    <button id="btnCloseComment">✖</button>
  </div>
  <div class="comment-list" id="commentList"></div>
  <div class="comment-input">
    <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
    <button id="btnSubmitComment">Envoyer</button>
  </div>
</div>

<script src="script.js" defer></script>
<script>
  // Sécurité pour s'assurer que le bouton fonctionne
  document.addEventListener("DOMContentLoaded", () => {
    const upload = document.getElementById("upload");
    const btnPublish = document.getElementById("btnPublish");

    btnPublish.addEventListener("click", () => {
      console.log("Bouton Publier cliqué !");
      upload.click();
    });
  });
</script>
</body>
</html>
