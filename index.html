<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />

<title>Luxury Cars Showroom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

    <a href="#cars" class="btn gold">Explorer</a>
    <a href="https://wa.me/000000000" class="btn dark">WhatsApp</a>

<section id="cars">

  <p class="center">Réservation rapide via WhatsApp</p>

<!-- MODAL DETAIL -->

  <div class="modal-box">
    <span onclick="closeModal()" class="close">✕</span>

<a class="whatsapp" href="https://wa.me/000000000">💬</a>
