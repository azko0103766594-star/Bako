<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0077cc; color: white; }
  .header-actions button { padding: 5px 10px; cursor: pointer; z-index: 10; }
  .container { display: flex; flex-wrap: wrap; padding: 10px; }
  .card { border: 1px solid #ccc; margin: 10px; padding: 10px; border-radius: 8px; width: 220px; text-align: center; }
  .comment-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; }
  .comment-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .comment-list { max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; }
  .comment-input { display: flex; background: white; padding: 10px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  .comment-input input { flex:1; padding:5px; margin-right:5px; }
  .empty { padding:20px; text-align:center; color:#777; }
</style>
</head>
<body>

<header>
  <h3>Mini Bako</h3>
  <div class="header-actions">
    <input type="file" id="upload" style="display:none;" accept="image/*">
    <button id="publishBtn">Publier</button>
  </div>
</header>

<div class="container" id="feed"></div>

<div class="comment-overlay" id="commentOverlay">
  <div style="background:white; border-radius:8px; width:300px;">
    <div class="comment-header">
      <h4>Commentaires</h4>
      <button id="closeCommentBtn">✖</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input">
      <input type="text" id="commentInput" placeholder="Ajouter un commentaire...">
      <button id="sendCommentBtn">Envoyer</button>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
