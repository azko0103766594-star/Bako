<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini Bako</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f2f2f2;
}

header {
  background: #4a6cb3;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
}

.card {
  background: white;
  margin: 10px;
  border-radius: 15px;
  padding: 10px;
  width: 150px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

img {
  width: 100%;
  border-radius: 10px;
}

.actions {
  margin-top: 5px;
}

.like {
  background: #ff4757;
  color: white;
}

</style>
</head>
<body>

<header>
  <h2>Mini Bako</h2>
  <input type="file" id="upload" hidden>
  <button onclick="document.getElementById('upload').click()">Publier une image</button>
</header>

<div class="container" id="gallery"></div>

<script>
let photos = JSON.parse(localStorage.getItem("photos")) || [];

const gallery = document.getElementById("gallery");

function save() {
  localStorage.setItem("photos", JSON.stringify(photos));
}

function render() {
  gallery.innerHTML = "";
  photos.forEach((p, i) => {
    p.views++;
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.url}">
      <div class="actions">
        ❤️ ${p.likes} | 👁️ ${p.views}
      </div>
      <button class="like" onclick="like(${i})">Like</button>
    `;

    gallery.appendChild(card);
  });
  save();
}

function like(i) {
  photos[i].likes++;
  render();
}

document.getElementById("upload").addEventListener("change", function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function() {
    photos.push({
      url: reader.result,
      likes: 0,
      views: 0
    });
    render();
  };

  reader.readAsDataURL(file);
});

render();
</script>

</body>
</html>
