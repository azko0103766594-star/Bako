<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flash Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MENU -->
<div id="menu">
  <h1>🧠 Memory Flash Pro</h1>

  <p>Choisis ton mode</p>

  <div class="mode-grid">

    <div class="mode easy" onclick="setMode('easy')"></div>
    <div class="mode normal" onclick="setMode('normal')"></div>
    <div class="mode hard" onclick="setMode('hard')"></div>
    <div class="mode insane" onclick="setMode('insane')"></div>

  </div>

  <br>
  <button onclick="startGame()">START</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">

  <h2 id="msg">👀 Observe</h2>
  <p id="timer"></p>

  <div class="grid">
    <div class="btn red" onclick="pick('red')"></div>
    <div class="btn green" onclick="pick('green')"></div>
    <div class="btn blue" onclick="pick('blue')"></div>
    <div class="btn yellow" onclick="pick('yellow')"></div>
  </div>

</div>

<!-- SONS -->
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="failSound" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
