<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f0f0f0; }
  .card { border: 1px solid #ccc; margin: 10px; padding: 10px; }
  .comment-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
  .comment-overlay div { background: #fff; padding: 20px; width: 300px; }
  button { cursor: pointer; margin: 2px; }
</style>
</head>

<body>

<header>
  <h3>Mini Bako</h3>
  <div class="header-actions">
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<div id="feed"></div>

<!-- COMMENT -->
<div class="comment-overlay" id="commentOverlay">
  <div>
    <h4>Commentaires</h4>
    <div id="commentList" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
    <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." style="width: 70%;">
    <button onclick="submitComment()">Envoyer</button>
    <button onclick="closeComments()">Fermer</button>
  </div>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<!-- Ton script JS -->
<script type="module" src="script.js"></script>

</body>
</html>
