<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Upload Supabase</title>
</head>
<body>

<h2>Test Upload Supabase</h2>
<input type="file" id="upload">
<div id="result"></div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
  // 🔹 Config Supabase
  const SUPABASE_URL = "https://sablkcwsqethbysqusgb.supabase.co"; // Ton projet
  const SUPABASE_ANON_KEY = "VOTRE_ANON_KEY"; // Remplace par ta clé ANON
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const uploadInput = document.getElementById("upload");
  const resultDiv = document.getElementById("result");

  uploadInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      // 🔹 Upload dans le bucket 'images', dossier 'public'
      const { data, error } = await supabase
        .storage
        .from("images")
        .upload(`public/${file.name}`, file, { upsert: true });

      if (error) throw error;

      // 🔹 Récupère l'URL publique
      const { publicUrl, error: urlError } = supabase
        .storage
        .from("images")
        .getPublicUrl(`public/${file.name}`);

      if (urlError) throw urlError;

      resultDiv.innerHTML = `<p>Upload réussi !</p>
                             <p>URL : <a href="${publicUrl}" target="_blank">${publicUrl}</a></p>
                             <img src="${publicUrl}" style="max-width:300px; margin-top:10px;">`;

    } catch (err) {
      console.error("Erreur upload :", err);
      resultDiv.innerHTML = `<p style="color:red;">Erreur : ${err.message}</p>`;
    }
  });
</script>

</body>
</html>
