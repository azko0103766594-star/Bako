<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Bako</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <!-- AVATAR -->
  <img src="image/file_0000000013bc7246bd7cb8bdbd8b49a8.png" class="avatar">

  <!-- TITRE -->
  <h3 class="logo">Mini Bako</h3>

  <!-- ACTIONS -->
  <div class="header-actions">
    <input type="file" id="upload" hidden accept="image/*">
    <button class="publish-btn" onclick="handlePublish()">Publier</button>
  </div>

</header>

<!-- SHARE -->
<div class="share-box" id="shareBox">
  <div class="share">
    <p>Partager ce post</p>
    <button onclick="sharePost()">📤 Partager</button>
    <button onclick="closeShare()">❌ Fermer</button>
  </div>
</div>

<!-- FEED -->
<div class="container" id="feed"></div>

<!-- COMMENTAIRES -->
<div class="comment-overlay" id="commentOverlay">
  <div class="comment-box">

    <div class="comment-header">
      <h4>Commentaires</h4>
      <button class="close-btn" onclick="closeComments()">✖</button>
    </div>

    <div class="comment-list" id="commentList"></div>

    <div class="comment-input-zone">
      <input id="commentInput" placeholder="Écrire un commentaire...">
      <button class="send-btn" onclick="submitComment()">Envoyer</button>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
