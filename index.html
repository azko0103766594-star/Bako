<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#eee; }
  .card { border:1px solid #ccc; margin:10px; padding:10px; background:#fff; }
  .comment-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
  .comment-overlay div { background:#fff; padding:20px; width:300px; border-radius:5px; }
  button { cursor:pointer; margin:2px; }
  img { max-width:100%; height:auto; }
</style>
</head>

<body>

<header>
  <h3>Mini Bako</h3>
  <div class="header-actions">
    <input type="file" id="upload" hidden accept="image/*">
    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<div id="feed"></div>

<!-- COMMENT OVERLAY -->
<div class="comment-overlay" id="commentOverlay">
  <div>
    <h4>Commentaires</h4>
    <div id="commentList" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
    <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." style="width:70%;">
    <button onclick="submitComment()">Envoyer</button>
    <button onclick="closeComments()">Fermer</button>
  </div>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<script type="module">
  // 🔹 Supabase config
  const SUPABASE_URL = "https://sablkcwsqethbysqusgb.supabase.co";  // remplace par ton URL
  const SUPABASE_ANON_KEY = "TON_ANON_KEY";                          // remplace par ta clé ANON
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 🔹 Elements HTML
  const feed = document.getElementById("feed");
  const upload = document.getElementById("upload");
  const commentOverlay = document.getElementById("commentOverlay");
  const commentList = document.getElementById("commentList");
  const commentInput = document.getElementById("commentInput");

  let posts = [];
  let currentCommentId = null;
  const userId = "user1"; // plus tard remplacer par vrai auth

  // 🔹 Ouvrir le input file
  function handlePublish() { upload.click(); }

  // 🔹 Upload image + ajouter post
  upload.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      const { data: uploadData, error: uploadError } = await supabase
        .storage
        .from("images")
        .upload(`public/${file.name}`, file, { upsert: true });
      if (uploadError) throw uploadError;

      const { publicUrl, error: urlError } = supabase
        .storage
        .from("images")
        .getPublicUrl(`public/${file.name}`);
      if (urlError) throw urlError;

      const { data: newPostData, error: insertError } = await supabase
        .from("posts")
        .insert([{ url: publicUrl, likes: [], comments: [] }])
        .select();
      if (insertError) throw insertError;

      posts.push(newPostData[0]);
      renderFeed();

    } catch (err) {
      console.error("Erreur upload :", err);
      alert("Erreur lors de l'upload : " + err.message);
    }
  });

  // 🔹 Récupérer tous les posts
  async function fetchPosts() {
    const { data, error } = await supabase.from("posts").select("*");
    if (error) return console.error(error);
    posts = data;
    renderFeed();
  }

  // 🔹 Affichage du feed
  function renderFeed() {
    feed.innerHTML = "";
    if (posts.length === 0) { feed.innerHTML = "<div class='empty'>Aucune image</div>"; return; }

    posts.forEach((p) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${p.url}">
        <div>❤️ ${p.likes?.length || 0} | 💬 ${p.comments?.length || 0}</div>
        <div>
          <button onclick="toggleLike('${p.id}')">
            ${p.likes?.includes(userId) ? 'Dislike' : 'Like'}
          </button>
          <button onclick="openComments('${p.id}')">💬 Commenter</button>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  // 🔹 Like / Dislike
  async function toggleLike(postId) {
    const post = posts.find(p => p.id === postId);
    if (!post) return;

    if (post.likes.includes(userId)) post.likes = post.likes.filter(u => u !== userId);
    else post.likes.push(userId);

    const { error } = await supabase
      .from("posts")
      .update({ likes: post.likes })
      .eq("id", postId);
    if (error) return console.error(error);

    renderFeed();
  }

  // 🔹 Ouvrir commentaires
  function openComments(postId) {
    currentCommentId = postId;
    updateComments();
    commentOverlay.style.display = "flex";
  }

  // 🔹 Afficher commentaires
  function updateComments() {
    const post = posts.find(p => p.id === currentCommentId);
    if (!post) return;
    commentList.innerHTML = (post.comments || []).map(c => `<p>${c}</p>`).join("");
  }

  // 🔹 Ajouter un commentaire
  async function submitComment() {
    const v = commentInput.value.trim();
    if (!v) return;

    const post = posts.find(p => p.id === currentCommentId);
    post.comments.push(v);

    const { error } = await supabase
      .from("posts")
      .update({ comments: post.comments })
      .eq("id", currentCommentId);
    if (error) return console.error(error);

    commentInput.value = "";
    updateComments();
    renderFeed();
  }

  // 🔹 Fermer overlay
  function closeComments() { commentOverlay.style.display = "none"; }

  // 🔹 Initialisation
  fetchPosts();

</script>

</body>
</html>
