<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <style>
    body { background:#111; color:white; text-align:center; font-family:Arial; }
    .grid { display:grid; grid-template-columns:repeat(2,120px); gap:10px; justify-content:center; margin-top:20px; }
    .btn { width:120px; height:120px; border-radius:10px; opacity:0.7; }
    .red{background:red;} .green{background:green;}
    .blue{background:blue;} .yellow{background:gold;}
    button{margin:5px;padding:10px;}
  </style>
</head>
<body>

<h1>🧠 Memory Flash</h1>

<p id="msg">Clique START</p>

<button onclick="startGame()">START</button>

<div class="grid">
  <div class="btn red" onclick="pick('red')"></div>
  <div class="btn green" onclick="pick('green')"></div>
  <div class="btn blue" onclick="pick('blue')"></div>
  <div class="btn yellow" onclick="pick('yellow')"></div>
</div>

<script src="script.js"></script>
</body>
</html>
