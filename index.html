<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luxury Motors - Premium Showroom</title>
<meta name="description" content="Showroom de voitures de luxe premium - réservation WhatsApp et catalogue exclusif" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}
body{font-family:Inter,sans-serif;background:#0b0b0f;color:#fff;overflow-x:hidden;}/* NAV */ header{ position:fixed;top:0;width:100%;padding:18px 40px;display:flex;justify-content:space-between;align-items:center; background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);z-index:1000; } .logo{font-family:'Playfair Display',serif;font-size:22px;color:#C9A14A;} nav a{color:#fff;margin-left:18px;text-decoration:none;font-size:14px;opacity:0.7;transition:0.3s;} nav a:hover{opacity:1;color:#C9A14A;}

/* HERO */ .hero{ height:100vh; background:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70') center/cover; display:flex;align-items:center;justify-content:center;text-align:center;position:relative; } .hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0.65);} .hero-content{position:relative;z-index:2;animation:fadeIn 1s ease;} .hero h1{font-size:54px;font-family:'Playfair Display';} .hero p{margin:20px 0;opacity:0.8;}

.btn{padding:12px 22px;margin:10px;border:none;cursor:pointer;border-radius:30px;font-weight:600;transition:0.3s;} .btn:hover{transform:scale(1.05);} .btn-gold{background:#C9A14A;color:#000;} .btn-dark{background:#111;color:#fff;border:1px solid #333;}

/* SECTION */ section{padding:80px 40px;} .section-title{text-align:center;font-size:32px;margin-bottom:40px;font-family:'Playfair Display';color:#C9A14A;}

/* FILTER */ .filter-bar{text-align:center;margin-bottom:30px;} .filter-bar input{ padding:10px;width:250px;border-radius:10px;border:none;outline:none; }

/* GRID */ .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;} .card{ background:rgba(255,255,255,0.05);border-radius:15px;overflow:hidden; transition:0.4s;backdrop-filter:blur(10px); transform:translateY(20px);opacity:0; animation:slideUp 0.6s forwards; } .card:hover{transform:translateY(-10px) scale(1.02);} .card img{width:100%;height:180px;object-fit:cover;} .card-content{padding:15px;} .card h3{color:#C9A14A;} .price{opacity:0.8;margin:5px 0;} .card button{width:100%;margin-top:10px;padding:10px;border:none;border-radius:10px;cursor:pointer;background:#C9A14A;color:#000;font-weight:600;}

/* MODAL */ .modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:2000;} .modal-content{background:#111;padding:20px;width:90%;max-width:520px;border-radius:15px;animation:fadeIn 0.3s ease;} .close{float:right;cursor:pointer;color:#C9A14A;font-size:22px;}

/* WHATSAPP */ .whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:15px;border-radius:50%;font-size:20px;text-decoration:none;}

/* FOOTER */ footer{text-align:center;padding:30px;color:#777;font-size:13px;}

/* ANIMATIONS */ @keyframes fadeIn{from{opacity:0}to{opacity:1}} @keyframes slideUp{to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){ .hero h1{font-size:34px;} header{padding:15px;} } </style>

</head>
<body><header>
<div class="logo">Luxury Motors</div>
<nav>
<a href="#home">Home</a>
<a href="#cars">Voitures</a>
<a href="#contact">Contact</a>
</nav>
</header><div class="hero" id="home">
<div class="hero-content">
<h1>Showroom de Luxe</h1>
<p>Les voitures les plus exclusives au monde</p>
<button class="btn btn-gold">Explorer</button>
<a class="btn btn-dark" href="https://wa.me/000000000">WhatsApp</a>
</div>
</div><section id="cars">
<div class="section-title">Catalogue Premium</div><div class="filter-bar">
<input id="search" placeholder="Rechercher une voiture..." oninput="filterCars()" />
</div><div class="grid" id="carGrid"></div>
</section><section id="contact">
<div class="section-title">Contact</div>
<p style="text-align:center;opacity:0.7">Réservation rapide via WhatsApp</p>
</section><div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<div id="modalText"></div>
</div>
</div><a class="whatsapp" href="https://wa.me/000000000">💬</a>

<footer>
© 2026 Luxury Motors - All rights reserved
</footer><script>
const cars=[
{name:"Bugatti Chiron",price:"3 000 000€",img:"https://images.unsplash.com/photo-1542362567-b07e54358753"},
{name:"Rolls Royce Phantom",price:"450 000€",img:"https://images.unsplash.com/photo-1619767886558-efdc259cde1a"},
{name:"Lamborghini Aventador",price:"500 000€",img:"https://images.unsplash.com/photo-1619767886558-efdc259cde1a"},
{name:"Ferrari SF90",price:"600 000€",img:"https://images.unsplash.com/photo-1541899481282-d53bffe3c35d"},
{name:"McLaren Speedtail",price:"2 000 000€",img:"https://images.unsplash.com/photo-1502877338535-766e1452684a"},
{name:"Pagani Huayra",price:"2 500 000€",img:"https://images.unsplash.com/photo-1511910849309-0dffb8788f0d"},
{name:"Koenigsegg Jesko",price:"3 200 000€",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70"},
{name:"Bentley Continental GT",price:"300 000€",img:"https://images.unsplash.com/photo-1525609004556-c46c7d6cf023"}
];

let filtered=cars;

const grid=document.getElementById("carGrid");

function render(){
grid.innerHTML="";
filtered.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";
div.style.animationDelay=(i*0.05)+"s";
div.innerHTML=`
<img loading='lazy' src="${c.img}" />
<div class='card-content'>
<h3>${c.name}</h3>
<div class='price'>${c.price}</div>
<button onclick="openModal('${c.name}','${c.price}')">Voir détails</button>
</div>`;
grid.appendChild(div);
});
}

function filterCars(){
let v=document.getElementById("search").value.toLowerCase();
filtered=cars.filter(c=>c.name.toLowerCase().includes(v));
render();
}

function openModal(name,price){
document.getElementById("modal").style.display="flex";
document.getElementById("modalText").innerHTML=`
<h2 style='color:#C9A14A'>${name}</h2>
<p>Prix: ${price}</p>
<br>
<a href='https://wa.me/000000000' style='color:#25D366'>Réserver sur WhatsApp</a>
`;
}

function closeModal(){document.getElementById("modal").style.display="none";}

render();
</script></body>
  </html>
