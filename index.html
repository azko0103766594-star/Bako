<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>
  <h3>Mini Bako</h3>

  <div>
    <!-- IMPORTANT: input file reste hidden -->
    <input type="file" id="upload" hidden accept="image/*">

    <button onclick="handlePublish()">Publier</button>
  </div>
</header>

<!-- FEED -->
<div class="container" id="feed">
  <p>Chargement du feed...</p>
</div>

<!-- COMMENTAIRES OVERLAY -->
<div class="comment-overlay" id="commentOverlay">

  <div class="comment-box">

    <div class="comment-header">
      <h4>Commentaires</h4>
      <button onclick="closeComments()">✖</button>
    </div>

    <div id="commentList" class="comment-list"></div>

    <div class="comment-input">
      <input id="commentInput" placeholder="Écrire un commentaire...">
      <button onclick="submitComment()">Envoyer</button>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
