<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luxury Auto - Apple Premium Edition</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;}
body{background:#050507;color:#fff;overflow-x:hidden;}

/* HEADER */
header{
position:fixed;top:0;left:0;width:100%;
background:rgba(10,10,15,0.6);
backdrop-filter:blur(20px);
display:flex;justify-content:space-between;align-items:center;
padding:15px 30px;
z-index:1000;
}
header h1{font-size:18px;color:#d4af37;letter-spacing:2px;}
nav a{color:#fff;margin-left:15px;text-decoration:none;font-size:13px;opacity:0.8;transition:0.3s;}
nav a:hover{opacity:1;color:#d4af37;}

/* HERO */
.hero{
height:100vh;
display:flex;align-items:center;justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
}
.hero video{
position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(0.4);
}
.hero-content{position:relative;z-index:2;}
.hero h2{font-size:55px;font-weight:600;}
.hero p{opacity:0.7;margin-top:10px;}

/* FILTER */
.filter{
padding:120px 20px 20px;
text-align:center;
}
.filter select{
padding:10px;
margin:5px;
border-radius:10px;
border:none;
outline:none;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:20px;
}
.card{
background:rgba(255,255,255,0.03);
border-radius:20px;
overflow:hidden;
transition:0.5s;
transform:translateY(0);
cursor:pointer;
}
.card:hover{transform:scale(1.03);}
.card img{width:100%;height:200px;object-fit:cover;}
.card-content{padding:15px;}
.card h3{color:#d4af37;}
.card p{font-size:12px;opacity:0.7;margin-top:5px;}
.price{margin-top:10px;font-weight:bold;}

.btn{
display:inline-block;margin-top:10px;padding:10px 15px;
background:#25D366;color:#fff;border-radius:10px;text-decoration:none;font-size:12px;
}

/* MODAL */
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:none;align-items:center;justify-content:center;
}
.modal-content{
background:#111;
padding:20px;
border-radius:20px;
width:90%;max-width:500px;
}

/* ADMIN */
.admin{
padding:40px;text-align:center;
}
input{
padding:10px;margin:5px;border-radius:10px;border:none;
}
button{
padding:10px 15px;border:none;border-radius:10px;cursor:pointer;
background:#d4af37;
}

/* ANIMATION APPLE */
.fade{
opacity:0;transform:translateY(20px);
animation:fade 1s forwards;
}
@keyframes fade{to{opacity:1;transform:translateY(0);}}

</style></head>
<body><header>
<h1>Luxury Auto</h1>
<nav>
<a href="#cars">Voitures</a>
<a href="#admin">Admin</a>
</nav>
</header><section class="hero">
<video autoplay muted loop src="https://cdn.coverr.co/videos/coverr-aerial-view-of-a-sports-car-5417/1080p.mp4"></video>
<div class="hero-content fade">
<h2>Experience Luxury Cars</h2>
<p>Apple-level automotive experience</p>
</div>
</section><section class="filter">
<select id="filterBrand">
<option value="all">Toutes marques</option>
<option value="Bugatti">Bugatti</option>
<option value="Ferrari">Ferrari</option>
<option value="Lamborghini">Lamborghini</option>
</select><select id="filterPrice">
<option value="all">Tous prix</option>
<option value="low">- 500k</option>
<option value="high">+ 500k</option>
</select>
</section><section class="grid" id="carList"></section><!-- MODAL DETAIL --><div class="modal" id="modal">
<div class="modal-content">
<h2 id="mTitle"></h2>
<p id="mDesc"></p>
<p id="mPrice"></p>
<a id="mWhats" class="btn" target="_blank">Réserver WhatsApp</a>
</div>
</div><!-- ADMIN --><section class="admin" id="admin">
<h2>Admin - Ajouter voiture</h2>
<input id="name" placeholder="Nom" />
<input id="brand" placeholder="Marque" />
<input id="price" placeholder="Prix" />
<input id="img" placeholder="Image URL" />
<button onclick="addCar()">Ajouter</button>
</section><script>
let cars = JSON.parse(localStorage.getItem("cars")) || [
{n:"Bugatti Chiron",b:"Bugatti",p:"3000000",i:"https://images.unsplash.com/photo-1616788494690-7a1f0b4f0b1e"},
{n:"Ferrari SF90",b:"Ferrari",p:"450000",i:"https://images.unsplash.com/photo-1603386329225"}
];

function render(){
let list=document.getElementById("carList");
list.innerHTML="";
let b=document.getElementById("filterBrand").value;
let p=document.getElementById("filterPrice").value;

cars.filter(c=>{
if(b!="all"&&c.b!=b)return false;
if(p=="low"&&c.p>500000)return false;
if(p=="high"&&c.p<500000)return false;
return true;
}).forEach((c,i)=>{
list.innerHTML+=`
<div class='card fade' onclick='openCar(${i})'>
<img src='${c.i}' />
<div class='card-content'>
<h3>${c.n}</h3>
<p>${c.b}</p>
<div class='price'>${c.p} €</div>
</div>
</div>`;
});
}

function openCar(i){
let c=cars[i];
document.getElementById("mTitle").innerText=c.n;
document.getElementById("mDesc").innerText="Voiture de luxe exclusive";
document.getElementById("mPrice").innerText=c.p+" €";
document.getElementById("mWhats").href="https://wa.me/22500000000?text=Je veux réserver " + c.n;
document.getElementById("modal").style.display="flex";
}

document.getElementById("modal").onclick=()=>modal.style.display="none";

function addCar(){
cars.push({
n:document.getElementById("name").value,
b:document.getElementById("brand").value,
p:document.getElementById("price").value,
i:document.getElementById("img").value
});
localStorage.setItem("cars",JSON.stringify(cars));
render();
}

document.getElementById("filterBrand").onchange=render;
document.getElementById("filterPrice").onchange=render;

render();
</script></body>
</html>
